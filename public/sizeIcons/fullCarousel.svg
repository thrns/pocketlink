  <!-- Carousel indicators (dots) -->
  <circle cx="41" cy="60" r="2" fill="white"/>
  <circle cx="50" cy="60" r="2" fill="white"/>
  <circle cx="59" cy="60" r="2" fill="white"/>
  
  <!-- Arrow left and right -->
  <path d="M27 50L23 46L27 42" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M73 50L77 46L73 42" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Slide content suggestion -->
  <rect x="35" y="40" width="30" height="12" rx="2" stroke="white" stroke-width="1.5"/>
